name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * 1"

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run validator unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Validate publication surface
        run: |
          set -euo pipefail
          python3 scripts/check_release.py

      - name: Validate Graphviz sources
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz
          mkdir -p /tmp/ccaa-figures
          for source in figures/*.dot; do
            dot -Tsvg "$source" -o "/tmp/ccaa-figures/$(basename "${source%.dot}").svg"
          done
          test "$(find /tmp/ccaa-figures -name '*.svg' | wc -l)" -eq 8

      - name: Validate repository metadata and release integrity
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DESCRIPTION: "Public-source incident analysis and reference architecture for containing cyber-capable AI agents with state-bound, commit-time authorization."
          EXPECTED_HOMEPAGE: "https://doi.org/10.5281/zenodo.23124432"
          EXPECTED_PDF_SHA256: "59074a5a1996a8851617a0d618f4a13df361c5bc1f19c487999f93d22f69cff4"
          EXPECTED_RELEASE_TAG: "v2.1.0"
        run: |
          set -euo pipefail

          repo_json="$(gh api "repos/${GITHUB_REPOSITORY}")"

          test "$(jq -r '.description // ""' <<<"$repo_json")" = "$EXPECTED_DESCRIPTION"
          test "$(jq -r '.homepage // ""' <<<"$repo_json")" = "$EXPECTED_HOMEPAGE"
          test "$(jq -r '.has_issues' <<<"$repo_json")" = "true"
          test "$(jq -r '.has_projects' <<<"$repo_json")" = "false"
          test "$(jq -r '.has_wiki' <<<"$repo_json")" = "false"

          for topic in \
            ai-security \
            ai-agents \
            agent-containment \
            cybersecurity \
            cyber-evaluation \
            formal-methods \
            llm-safety \
            preprint \
            reproducible-research \
            security-research
          do
            jq -e --arg topic "$topic" '.topics | index($topic) != null' <<<"$repo_json" >/dev/null
          done

          release_ok=false
          for attempt in $(seq 1 30); do
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
            release_tag="$(jq -r '.tag_name // ""' <<<"$release_json")"
            asset_digest="$(
              jq -r --arg name "Containing-Cyber-Capable-AI-Agents.pdf" \
                '.assets[] | select(.name == $name) | .digest // ""' \
                <<<"$release_json"
            )"
            if [ "$release_tag" = "$EXPECTED_RELEASE_TAG" ] && \
               [ "$asset_digest" = "sha256:${EXPECTED_PDF_SHA256}" ] && \
               [ "$(jq -r '.draft' <<<"$release_json")" = "false" ] && \
               [ "$(jq -r '.prerelease' <<<"$release_json")" = "false" ]; then
              release_ok=true
              break
            fi
            sleep 3
          done
          test "$release_ok" = "true"
